<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7a68">
<title>Compra en casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#16221e;--mute:#667771;--line:#e1e8e5;--acc:#0e7a68;--accs:#dcf0ec;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 calc(130px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:20px 0 8px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.02em}
.who{background:none;border:0;font:inherit;color:var(--mute);padding:6px 0;cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#c9d3cf;margin-right:6px}
.dot.on{background:#22a06b}
input,select,textarea,button{font:inherit;color:inherit}
.search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin:6px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
h2{font-size:15px;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-weight:600}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:18px;border:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.chk{font-size:22px;background:none;border:0;padding:4px;cursor:pointer;line-height:1}
.m{flex:1;cursor:pointer;min-width:0}
.m b{font-weight:600}.m small{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mute);margin-top:2px}
.m em{display:block;font-style:normal;color:var(--mute);margin-top:2px}
.done .m{opacity:.5}.done .m b,.done .m>span{text-decoration:line-through}
.empty{color:var(--mute);padding:18px;text-align:center}
.link{background:none;border:0;color:var(--red);cursor:pointer;font-weight:600}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(76px + env(safe-area-inset-bottom));background:var(--acc);color:#fff;border:0;border-radius:99px;padding:15px 22px;font-weight:600;box-shadow:0 6px 20px rgba(14,122,104,.35);cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:none;border:0;padding:12px 4px;color:var(--mute);cursor:pointer;font-size:13px}
nav button.on{color:var(--acc);font-weight:800}
.hab{display:flex;flex-wrap:wrap;gap:8px}
.hab button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer}
.hab button:disabled{opacity:.45;cursor:default}
.hab button i{font-style:normal;color:var(--mute);font-size:12px;margin-left:6px}
.srow{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border:0}.srow span:last-child{font-weight:800}
dialog{border:0;border-radius:22px;padding:20px;width:min(92vw,440px)}
dialog::backdrop{background:rgba(10,20,17,.45)}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.acts{display:flex;gap:10px;margin-top:18px}
.acts button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer}
.acts .ok{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.users button{display:block;width:100%;margin-top:10px;padding:16px;font-size:18px;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;line-height:1.5}
.card code,.card pre{background:var(--bg);border-radius:8px;padding:2px 6px;font-size:13px}.card pre{padding:10px;overflow:auto}
@media (prefers-reduced-motion:no-preference){.row{transition:opacity .2s}}
</style>
</head>
<body>
<main>
  <header><div><h1>Compra en casa</h1><button class="who" id="who"></button></div><span><span class="dot" id="dot"></span></span></header>
  <input class="search" id="q" type="search" placeholder="🔎 Buscar producto..." autocomplete="off">
  <div id="v"></div>
</main>
<button class="fab" id="add">+ Añadir producto</button>
<nav><div id="nav">
  <button data-v="lista">🛒 Lista</button><button data-v="hab">⭐ Habituales</button><button data-v="hist">🕘 Historial</button><button data-v="stats">📊 Datos</button>
</div></nav>

<dialog id="who-d"><h2 style="margin-top:0;color:var(--ink);font-size:22px">¿Quién eres?</h2><div class="users" id="users"></div></dialog>

<dialog id="item-d">
  <form id="f" method="dialog">
    <h2 id="ftitle" style="margin:0;color:var(--ink);font-size:20px"></h2>
    <label for="fn">Producto</label><input id="fn" list="sug" required autocomplete="off"><datalist id="sug"></datalist>
    <label for="fq">Cantidad</label><input id="fq" value="1">
    <label for="fc">Categoría</label><select id="fc"></select>
    <label for="fo">Nota (opcional)</label><textarea id="fo" rows="2"></textarea>
    <div class="acts"><button type="button" id="fx">Cancelar</button><button class="ok" type="submit">Guardar</button></div>
    <div class="acts" id="delw" style="display:none"><button type="button" id="fdel" style="color:var(--red)">🗑️ Eliminar producto</button></div>
  </form>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,update,push} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ====== 1) PEGA AQUÍ LA CONFIGURACIÓN DE TU PROYECTO FIREBASE ====== */
const CONFIG = {
  apiKey: "AIzaSyBFso0j9t2OURSMUeprfqSGHjG838HNmOM",
  authDomain: "lista-de-la-compra-ab042.firebaseapp.com",
  databaseURL: "https://lista-de-la-compra-ab042-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lista-de-la-compra-ab042",
  storageBucket: "lista-de-la-compra-ab042.firebasestorage.app",
  messagingSenderId: "316219571938",
  appId: "1:316219571938:web:2e895af14e51f57c91e8bb"
};
/* ================================================================== */
const USERS = ["Oier","Persona 2","Persona 3"];
const BASE = ["🥛 Lácteos","🥩 Carne","🐟 Pescado","🥦 Fruta y verdura","🍝 Alimentación","🧃 Bebidas","🧹 Limpieza","🧻 Higiene y baño","🏠 Hogar","🐶 Mascotas","Otros"];
const DEFAULTS = [["Leche","🥛 Lácteos"],["Pan","🍝 Alimentación"],["Huevos","🍝 Alimentación"],["Agua","🧃 Bebidas"],["Yogures","🥛 Lácteos"],["Papel higiénico","🧻 Higiene y baño"],["Detergente","🧹 Limpieza"]];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const day=t=>new Date(t).toLocaleDateString("es-ES");
const fmt=t=>new Date(t).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const arr=o=>Object.entries(o||{}).map(([id,v])=>({id,...v}));
const tally=(a,k)=>{const m={};a.forEach(x=>{m[x[k]]=(m[x[k]]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};

const S={items:{},log:{},hist:{},cats:{}};
let user=localStorage.getItem("compra_user"),view="lista",catF="",q="",editId=null,db=null;

function allCats(){return [...BASE.slice(0,-1),...arr(S.cats).map(c=>c.n),"Otros"]}
const ready=CONFIG.apiKey!=="TU_API_KEY";

if(ready){
  db=getDatabase(initializeApp(CONFIG));
  for(const k of ["items","log","hist","cats"]) onValue(ref(db,k),s=>{S[k]=s.val()||{};render()});
  onValue(ref(db,".info/connected"),s=>$("#dot").classList.toggle("on",!!s.val()));
}
const up=o=>update(ref(db),o);

/* ---- identidad ---- */
function who(){
  $("#who").textContent=user?`Hola, ${user} 👋`:"";
  if(!user){$("#users").innerHTML=USERS.map(u=>`<button>👤 ${esc(u)}</button>`).join("");$("#who-d").showModal()}
}
$("#users").onclick=e=>{const b=e.target.closest("button");if(!b)return;user=b.textContent.replace("👤 ","");localStorage.setItem("compra_user",user);$("#who-d").close();who()};
$("#who-d").addEventListener("cancel",e=>{if(!user)e.preventDefault()});
$("#who").onclick=()=>{user=null;who()};

/* ---- vistas ---- */
const row=i=>`<li class="row ${i.done?"done":""}"><button class="chk" data-t="${i.id}" aria-label="${i.done?"Desmarcar":"Marcar comprado"}">${i.done?"✅":"🛒"}</button><div class="m" data-e="${i.id}"><b>${esc(i.n)}</b> <span>— ${esc(i.q)}</span><small><span>${esc(i.c)}</span><span>${esc(i.by)}</span><span>${fmt(i.t)}</span></small>${i.note?`<em>📝 ${esc(i.note)}</em>`:""}</div></li>`;

function vLista(){
  const items=arr(S.items),cats=[...new Set(items.map(i=>i.c))];
  if(catF&&!cats.includes(catF))catF="";
  const f=items.filter(i=>(!catF||i.c===catF)&&(!q||norm(i.n).includes(norm(q)))).sort((a,b)=>b.t-a.t);
  const p=f.filter(i=>!i.done),d=f.filter(i=>i.done);
  return `<div class="chips"><button class="chip ${catF?"":"on"}" data-cat="">Todas</button>${cats.map(c=>`<button class="chip ${c===catF?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <h2>PENDIENTES (${p.length})</h2><ul>${p.map(row).join("")||`<li class="empty">Nada pendiente. Pulsa «Añadir producto».</li>`}</ul>
  <h2>COMPRADOS (${d.length}) ${d.length?`<button class="link" id="clear">🗑️ Limpiar comprados</button>`:""}</h2><ul>${d.map(row).join("")||`<li class="empty">Aún no hay productos comprados.</li>`}</ul>`;
}

function habituales(){
  const log=arr(S.log),m={};
  log.forEach(l=>{const k=norm(l.n);(m[k]=m[k]||{n:l.n,c:l.c,k:0}).k++;m[k].c=l.c});
  const fav=Object.values(m).filter(x=>x.k>=2).sort((a,b)=>b.k-a.k).slice(0,12);
  const have=new Set(fav.map(x=>norm(x.n)));
  const base=DEFAULTS.filter(([n])=>!have.has(norm(n))).map(([n,c])=>({n,c,k:0}));
  return [...fav,...base];
}
function vHab(){
  const pend=new Set(arr(S.items).filter(i=>!i.done).map(i=>norm(i.n)));
  const list=habituales().filter(x=>!q||norm(x.n).includes(norm(q)));
  return `<h2>⭐ PRODUCTOS HABITUALES</h2><div class="hab">${list.map(x=>`<button data-add="${esc(x.n)}" data-c="${esc(x.c)}" ${pend.has(norm(x.n))?"disabled":""}>${esc(x.n)}${x.k?`<i>${x.k}×</i>`:""}</button>`).join("")}</div>
  <p class="empty">Los productos que añadís varias veces aparecen aquí solos.</p>`;
}
function vHist(){
  const h=arr(S.hist).filter(x=>!q||norm(x.n).includes(norm(q))).sort((a,b)=>b.t-a.t),g={};
  h.forEach(x=>(g[day(x.t)]=g[day(x.t)]||[]).push(x));
  return `<h2>HISTORIAL</h2>`+(Object.entries(g).map(([d,xs])=>`<h2>${d}</h2><ul>${xs.map(x=>`<li class="row"><div class="m"><b>${esc(x.n)}</b> <span>— comprado</span><small><span>${esc(x.q)}</span><span>${esc(x.by)}</span></small></div></li>`).join("")}</ul>`).join("")||`<p class="empty">Todavía no hay compras registradas.</p>`);
}
function vStats(){
  const now=new Date(),mo=t=>{const d=new Date(t);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()};
  const log=arr(S.log),hist=arr(S.hist);
  const top=a=>a[0]?`${esc(a[0][0])} (${a[0][1]})`:"—";
  const topP=tally(log.map(l=>({n:l.n.trim()[0]?.toUpperCase()+l.n.trim().slice(1).toLowerCase()})),"n").slice(0,5);
  const rows=[["Comprados este mes",hist.filter(x=>mo(x.t)).length],["Añadidos este mes",log.filter(x=>mo(x.t)).length],["Categoría que más se compra",top(tally(hist,"c"))],["Quien más añade",top(tally(log,"by"))]];
  return `<h2>📊 ESTADÍSTICAS</h2><ul>${rows.map(r=>`<li class="srow"><span>${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul>
  <h2>PRODUCTOS MÁS AÑADIDOS</h2><ul>${topP.map(([n,c])=>`<li class="srow"><span>${esc(n)}</span><span>${c}×</span></li>`).join("")||`<li class="empty">Sin datos todavía.</li>`}</ul>`;
}
function setup(){
  return `<div class="card"><b>Falta conectar la base de datos</b><ol><li>En <code>console.firebase.google.com</code> crea un proyecto y añade una app web (&lt;/&gt;).</li><li>En «Realtime Database» pulsa «Crear base de datos».</li><li>En la pestaña «Reglas» pega esto y publica:<pre>{"rules":{".read":true,".write":true}}</pre></li><li>Copia la configuración de la app web en el bloque <code>CONFIG</code> al inicio del script de este archivo.</li></ol></div>`;
}
function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  $("#v").innerHTML=!ready?setup():{lista:vLista,hab:vHab,hist:vHist,stats:vStats}[view]();
  $("#sug").innerHTML=habituales().map(x=>`<option value="${esc(x.n)}">`).join("");
}

/* ---- acciones ---- */
function fillCats(sel){$("#fc").innerHTML=allCats().map(c=>`<option ${c===sel?"selected":""}>${esc(c)}</option>`).join("")+`<option value="__new">➕ Nueva categoría…</option>`}
function openForm(it){
  if(!ready||!user)return;
  editId=it?it.id:null;
  $("#ftitle").textContent=it?"Editar producto":"Añadir producto";
  $("#fn").value=it?.n||"";$("#fq").value=it?.q||"1";$("#fo").value=it?.note||"";
  fillCats(it?.c||"🍝 Alimentación");$("#delw").style.display=it?"flex":"none";
  $("#item-d").showModal();
}
$("#fc").onchange=e=>{
  if(e.target.value!=="__new")return;
  const n=(prompt("Nombre de la nueva categoría (puedes empezar con un emoji):")||"").trim();
  if(n){const id=push(ref(db,"cats")).key;up({[`cats/${id}`]:{n}});S.cats[id]={n};}
  fillCats(n||"Otros");
};
$("#fx").onclick=()=>$("#item-d").close();
$("#f").onsubmit=()=>{
  const n=$("#fn").value.trim();if(!n)return;
  const d={n,q:$("#fq").value.trim()||"1",c:$("#fc").value,note:$("#fo").value.trim()};
  if(editId){const o={};for(const k in d)o[`items/${editId}/${k}`]=d[k];up(o)}
  else addItem(d);
};
function addItem(d){
  const id=push(ref(db,"items")).key,t=Date.now();
  up({[`items/${id}`]:{...d,by:user,t,done:false},[`log/${id}`]:{n:d.n,c:d.c,by:user,t}});
}
$("#fdel").onclick=()=>{if(confirm("¿Eliminar este producto?")){up({[`items/${editId}`]:null});$("#item-d").close()}};
function toggle(id){
  const i=S.items[id];if(!i)return;
  if(i.done)up({[`items/${id}/done`]:false,[`hist/${id}`]:null});
  else up({[`items/${id}/done`]:true,[`hist/${id}`]:{n:i.n,q:i.q,c:i.c,by:user,t:Date.now()}});
}
$("#add").onclick=()=>openForm();
$("#q").oninput=e=>{q=e.target.value;render()};
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){view=b.dataset.v;render()}};
$("#v").onclick=e=>{
  const t=e.target.closest("[data-t]"),ed=e.target.closest("[data-e]"),a=e.target.closest("[data-add]"),c=e.target.closest("[data-cat]");
  if(t)toggle(t.dataset.t);
  else if(ed)openForm({id:ed.dataset.e,...S.items[ed.dataset.e]});
  else if(a&&user)addItem({n:a.dataset.add,q:"1",c:a.dataset.c,note:""});
  else if(c){catF=c.dataset.cat;render()}
  else if(e.target.id==="clear"){
    const d=arr(S.items).filter(i=>i.done);
    if(d.length&&confirm(`¿Eliminar los ${d.length} productos comprados de la lista?`)){const o={};d.forEach(i=>o[`items/${i.id}`]=null);up(o)}
  }
};
who();render();
</script>
</body>
</html>
